/* === Mobile UI polish v7.2 === */
@media (max-width: 820px) {
  html, body { overflow-x: hidden; }

function cardOf(e){
 const {id,branch}=splitEntry(e),c=clone(cards[id]);c.baseId=id;c.branch=branch;
 if(branch){
   c.name+=branch==='A'?'・烈':'・巧';
   if(c.type==='unit'){
     if(branch==='A')c.levels.forEach(l=>l.atk+=2);
     else{c.hp+=2;c.levels[2].atk+=1}
   }else if(branch==='A'){
     c.blazing=true;
     if(spellBlazeText[id])c.text=spellBlazeText[id];
   }else{
     c.craft=true;
     if(id==='forecast'){c.craftHeal=1;c.text+=' 使用時、HP1回復。'}
     else c.cost=Math.max(0,c.cost-1);
   }
 }
 return c
}

function allocated(){return S.pboard.reduce((n,u)=>n+u.crystals,0)} function lockedOnBoard(){return S.pboard.reduce((n,u)=>n+(u.lockedCrystals||0),0)} function lockedTotal(){return S.lockedReserve+lockedOnBoard()} function freeCap(){return Math.max(0,S.total-allocated()-S.lockedReserve)} function level(u){return Math.min(3,Math.max(1,u.crystals))} function atk(u){let a=u.levels[level(u)-1].atk+(hasRelic('warMark')&&level(u)===3?1:0)+(hasRelic('verdantThrone')&&S.total>=8&&level(u)===3?2:0);if(u.cardId==='bulwark'&&S.hp>=15)a+=5;if(u.cardId==='skyCompiler'&&level(u)>=2&&S.spellsThisTurn>=3)a+=2;if(u.cardId==='chainLancer'&&S.cardsDrawnThisTurn>=3)a+=level(u)>=3?3:2;if(u.cardId==='graveScholar'&&S.deathsThisTurn>0)a+=level(u)>=3?4:level(u)>=2?3:2;if(u.cardId==='radiantKnight'&&S.hp>=18)a+=level(u)>=3?7:level(u)>=2?5:4;if(u.cardId==='judgmentCannon'&&S.hp>=20)a+=level(u)>=3?7:level(u)>=2?5:4;a+=(u.turnAtkBonus||0);return a} function playerGuard(){return S.pboard.reduce((n,u)=>n+((u.guard&&u.guard[level(u)-1])||0),0)}
function actualCost(c,entry=null){let v=c.cost;if(c.type==='unit'&&entry&&S.echoDiscountEntry===entry)v--;if(c.type==='spell'&&S.spellDiscount>0)v--;if(c.type==='spell'&&c.color==='red'&&hasRelic('firstSpark')&&!S.redFreeUsed)v--;return Math.max(0,v)}
function draw(n=1){for(let k=0;k<n;k++){if(S.hand.length>=9)return log('手札上限。');if(!S.draw.length){if(!S.discard.length)return;S.draw=shuffle(S.discard);S.discard=[]}S.hand.push(S.draw.pop());S.cardsDrawnThisTurn++}}
function playCard(i){if(S.locked)return;const entry=S.hand[i],c=cardOf(entry),cost=actualCost(c,entry);if(c.type==='unit'){if(S.pboard.length>=5)return toast('味方盤面がいっぱいです');if(S.free<Math.max(1,cost))return toast(`召喚には自由結晶${Math.max(1,cost)}個以上が必要です`);const summonCard=clone(c);summonCard.cost=cost;return chooseSummon(i,entry,summonCard)}if(S.free<cost)return toast('自由結晶が足りません');S.free-=cost;S.hand.splice(i,1);if(c.type==='unit'&&S.echoDiscountEntry===entry)S.echoDiscountEntry=null;if(c.color==='red'&&hasRelic('firstSpark')&&!S.redFreeUsed)S.redFreeUsed=true;if(S.spellDiscount>0)S.spellDiscount--;S.discard.push(entry);S.spellsThisTurn++;castSpell(c);log(`${c.name}を使用。`);if(hasRelic('blueArchive')&&S.spellsThisTurn%5===0)draw(1);checkEnd();render()}
function chooseSummon(i,entry,c){const opts=[1,2,3].filter(n=>S.free>=Math.max(c.cost,n));modal(`<h2>${c.name}を召喚</h2><p>コスト${c.cost}は<b>このターン拘束する総結晶数</b>です。Lv用の結晶はその中に含まれます。</p><div class="choices">${opts.map(n=>{const commit=Math.max(c.cost,n),reserve=Math.max(0,c.cost-n);return `<div class="choice" data-slv="${n}"><h3>Lv${n}で召喚</h3><div>拘束 ${commit}晶（カード上${n}${reserve?`＋一時拘束${reserve}`:''}）</div><p class="tiny">ATK ${c.levels[n-1].atk} / ${c.levels[n-1].text}</p></div>`}).join('')}</div><button class="btn" id="cancelSummon">戻る</button>`);document.querySelectorAll('[data-slv]').forEach(el=>el.onclick=()=>{closeModal();summonAt(i,entry,c,+el.dataset.slv)});$('cancelSummon').onclick=closeModal}
function summonAt(i,entry,c,n){const commitment=Math.max(c.cost,n),reserve=Math.max(0,c.cost-n);if(S.free<commitment)return toast('自由結晶が足りません');S.free-=commitment;S.lockedReserve+=reserve;S.hand.splice(i,1);if(S.echoDiscountEntry===entry)S.echoDiscountEntry=null;const u={...clone(c),entry,cardId:c.baseId,hp:c.hp,maxHp:c.hp,crystals:n,lockedCrystals:n,printedCost:c.cost,exhausted:!c.quickAttack,summonedTurn:S.turn,attacksMadeThisTurn:0};S.pboard.push(u);onSummon(u);if(hasRelic('softFurnace')&&!S.softUsed&&c.cost>=4&&S.lockedReserve>0){S.lockedReserve--;S.free++;S.softUsed=true;log('軟晶炉：一時拘束晶を1個解放。')}if(hasRelic('giantHeart')&&c.cost>=5){S.shield+=4;log('巨人の心臓：障壁4。')}log(`${c.name}をLv${n}で召喚。${commitment}晶をこのターン拘束。`);checkEnd();render()}
function onSummon(u){
if(u.cardId==='seedling'&&Math.random()<.25){S.total++;S.free++;log('晶芽の獣：総結晶+1。')}
if(u.cardId==='tactician')draw(level(u)>=3?2:1);
if(u.cardId==='blazeKnight'&&level(u)>=3)damageEnemy(2);
if(u.cardId==='worldroot'&&level(u)>=3){for(let i=S.eboard.length-1;i>=0;i--)damageUnit('enemy',i,3)}
if(u.cardId==='titan'&&level(u)>=3){for(let i=S.eboard.length-1;i>=0;i--)damageUnit('enemy',i,5);S.shield+=5}
if(u.cardId==='medic'){const h=level(u);S.hp=Math.min(S.maxHp,S.hp+h);log(`白晶整備士：HPを${h}回復。`)}
if(u.cardId==='reaper'&&level(u)>=3){damageEnemy(3);log('虚葬の刈手：Lv3召喚時、敵本体に3。')}
if(u.cardId==='abyssDragon'&&level(u)>=3){for(let i=S.eboard.length-1;i>=0;i--)damageUnit('enemy',i,4);damageEnemy(4);log('冥界巨竜アビサル：Lv3召喚時、敵全体に4。')}
if(u.cardId==='graveAdept')returnUnitFromDiscard(level(u)>=3?2:1,true);
if(u.cardId==='skyCompiler'&&level(u)>=3&&S.spellsThisTurn>=3){draw(2);log('蒼天演算竜：スペル連鎖を解析し2枚ドロー。')}
if(u.cardId==='infernoDragon'&&level(u)>=3&&S.attacksThisTurn>=3){u.ignoreSummonSicknessThisTurn=true;u.fixedAttackLimitThisTurn=2;u.attacksMadeThisTurn=0;u.exhausted=false;log('劫火竜イグナディオ：3回以上攻撃済みのため、召喚ターンから2回攻撃可能。')}
if(u.cardId==='primalColossus'&&level(u)>=3){for(let i=S.eboard.length-1;i>=0;i--)damageUnit('enemy',i,7);log('原初巨神オルビス：Lv3召喚時、敵UNIT全体に7。')}
if(u.cardId==='soulBroker'){if(level(u)>=3)reviveLowCost(3,2);else returnUnitFromDiscard(level(u)>=2?3:2,true)}
if(u.cardId==='underworldKing'&&level(u)>=3){for(let i=S.eboard.length-1;i>=0;i--)damageUnit('enemy',i,6);damageEnemy(6);log('冥府王ネクロディア：Lv3召喚時、敵全体に6。')}
}
function returnUnitFromDiscard(maxCost=99,auto=false,discountThisTurn=false){const picks=S.discard.map((e,i)=>({e,i,c:cardOf(e)})).filter(x=>x.c.type==='unit'&&x.c.cost<=maxCost);if(!picks.length){log('回収できるユニットがない。');return}if(auto){const x=picks[picks.length-1];S.discard.splice(x.i,1);if(S.hand.length<9){S.hand.push(x.e);if(discountThisTurn)S.echoDiscountEntry=x.e;log(`${x.c.name}を捨て札から手札へ戻した${discountThisTurn?'（このターンCost-1）':''}。`)}else S.discard.push(x.e);return}modal(`<h2>残響回収</h2><p>手札へ戻すUNITを選択。${discountThisTurn?'烈式：回収したUNITはこのターンCost-1。':''}</p><div class="decklist">${picks.map((x,j)=>`<div class="deckrow"><span>${x.c.name} / Cost ${x.c.cost}</span><button class="btn" data-return="${j}">回収</button></div>`).join('')}</div>`);document.querySelectorAll('[data-return]').forEach(el=>el.onclick=()=>{const x=picks[+el.dataset.return];const idx=S.discard.indexOf(x.e);if(idx>=0&&S.hand.length<9){const entry=S.discard.splice(idx,1)[0];S.hand.push(entry);if(discountThisTurn)S.echoDiscountEntry=entry;log(`${x.c.name}を手札へ回収${discountThisTurn?'（このターンCost-1）':''}。`)}closeModal();render()})}
function reviveLowCost(maxCost=3,lv=2){
 if(S.pboard.length>=5)return log('盤面がいっぱいで蘇生できない。');
 const picks=S.discard.map((e,i)=>({e,i,c:cardOf(e)})).filter(x=>x.c.type==='unit'&&x.c.cost<=maxCost);
 if(!picks.length)return log('蘇生できるUNITがない。');
 const x=picks[picks.length-1],idx=S.discard.indexOf(x.e),entry=S.discard.splice(idx,1)[0],c=cardOf(entry),n=Math.min(3,lv);
 const u={...clone(c),entry,cardId:c.baseId,hp:c.hp,maxHp:c.hp,crystals:n,lockedCrystals:0,printedCost:c.cost,exhausted:!c.quickAttack,summonedTurn:S.turn,attacksMadeThisTurn:0};
 S.pboard.push(u);onSummon(u);log(`${c.name}をLv${n}で蘇生。`)
}
function chooseReviveLowCost(maxCost=3,lv=2,sourceName='蘇生'){
 if(S.pboard.length>=5){log('盤面がいっぱいで蘇生できない。');return}
 const picks=S.discard.map((e,i)=>({e,i,c:cardOf(e)})).filter(x=>x.c.type==='unit'&&x.c.cost<=maxCost);
 if(!picks.length){log('蘇生できるUNITがない。');return}
 const n=Math.min(3,lv);
 modal(`<h2>${sourceName}</h2><p>捨て札からCost${maxCost}以下のUNIT1体を選び、Lv${n}で蘇生します。</p><div class="decklist">${
   picks.map((x,j)=>{
     const l=x.c.levels?.[n-1];
     const detail=l?`ATK ${l.atk} / ${l.text}`:'';
     return `<div class="deckrow"><span>${x.c.name} / Cost ${x.c.cost}<div class="tiny">→ Lv${n} ${detail}</div></span><button class="btn" data-revive-low="${j}">蘇生</button></div>`
   }).join('')
 }</div><button class="btn" id="cancelReviveLow">キャンセル</button>`);
 document.querySelectorAll('[data-revive-low]').forEach(el=>el.onclick=()=>{
   const x=picks[+el.dataset.reviveLow];
   const idx=S.discard.indexOf(x.e);
   if(idx<0){closeModal();return}
   const entry=S.discard.splice(idx,1)[0],c=cardOf(entry);
   const u={...clone(c),entry,cardId:c.baseId,hp:c.hp,maxHp:c.hp,crystals:n,lockedCrystals:0,printedCost:c.cost,exhausted:!c.quickAttack,summonedTurn:S.turn,attacksMadeThisTurn:0};
   S.pboard.push(u);onSummon(u);log(`${sourceName}：${c.name}をLv${n}で蘇生。`);
   closeModal();checkEnd();render();
 });
 const cancel=$('cancelReviveLow'); if(cancel) cancel.onclick=closeModal;
}
function showDiscardChoice(title='思考整理'){if(!S.hand.length)return;modal(`<h2>${title}</h2><p>捨てる手札を1枚選択。</p><div class="decklist">${S.hand.map((e,i)=>`<div class="deckrow"><span>${cardOf(e).name}</span><button class="btn" data-discard="${i}">捨てる</button></div>`).join('')}</div>`);document.querySelectorAll('[data-discard]').forEach(el=>el.onclick=()=>{const i=+el.dataset.discard;if(S.hand[i]!==undefined){const e=S.hand.splice(i,1)[0];S.discard.push(e);log(`${cardOf(e).name}を手札から捨てた。`)}closeModal();render()})}
function showReviveChoice(blazing=false){if(S.pboard.length>=5){log('盤面がいっぱいで蘇生できない。');return}const picks=S.discard.map((e,i)=>({e,i,c:cardOf(e)})).filter(x=>x.c.type==='unit');if(!picks.length){log('蘇生できるユニットがない。');return}modal(`<h2>禁忌再生${blazing?'・烈':''}</h2><p>捨て札のUNIT1枚をLv3で直接召喚します。蘇生した3結晶は固定されません。${blazing?'その後、Cost2以下UNIT1体をLv1で追加蘇生できます。':''}</p><div class="decklist">${picks.map((x,j)=>`<div class="deckrow"><span>${x.c.name} / 本来Cost ${x.c.cost}</span><button class="btn" data-revive="${j}">蘇生</button></div>`).join('')}</div>`);document.querySelectorAll('[data-revive]').forEach(el=>el.onclick=()=>{const x=picks[+el.dataset.revive];const idx=S.discard.indexOf(x.e);if(idx<0)return;const entry=S.discard.splice(idx,1)[0],c=cardOf(entry);const u={...clone(c),entry,cardId:c.baseId,hp:c.hp,maxHp:c.hp,crystals:3,lockedCrystals:0,printedCost:c.cost,exhausted:!c.quickAttack,summonedTurn:S.turn,attacksMadeThisTurn:0};S.pboard.push(u);onSummon(u);log(`${c.name}を禁忌再生でLv3蘇生。`);closeModal();checkEnd();render();if(blazing&&S.pboard.length<5)chooseReviveLowCost(2,1,'禁忌再生・烈')})}
function validEnemy(){return Number.isInteger(S.selectedEnemy)&&S.eboard[S.selectedEnemy]} function validPlayer(){return Number.isInteger(S.selectedPlayer)&&S.pboard[S.selectedPlayer]}
function forceReleaseCrystal(i){const u=S.pboard[i];if(!u||u.crystals<1)return false;u.crystals--;if((u.lockedCrystals||0)>u.crystals)u.lockedCrystals=u.crystals;S.free++;log(`${u.name}上の結晶1個を自由結晶へ変換。`);if(u.crystals===0){log(`${u.name}が0結晶になり自壊。`);damageUnit('player',i,999)}return true}
function grantTwoAttacks(u,atkBonus=0,source='効果'){if(!u)return false;u.fixedAttackLimitThisTurn=2;u.attacksMadeThisTurn=u.attacksMadeThisTurn||0;if(atkBonus)u.turnAtkBonus=(u.turnAtkBonus||0)+atkBonus;if((u.summonedTurn!==S.turn||u.quickAttack||u.ignoreSummonSicknessThisTurn)&&u.attacksMadeThisTurn<2)u.exhausted=false;log(`${source}：${u.name}はこのターン2回攻撃できる${atkBonus?` / ATK+${atkBonus}`:''}。`);return true}
function chooseZeroPointTarget(){
 if(!S.pboard.length){log('零点展開：対象にできる味方UNITがいない。');return}
 const grant=u=>grantTwoAttacks(u,0,'零点展開');
 if(validPlayer()){grant(S.pboard[S.selectedPlayer]);return}
 if(S.pboard.length===1){grant(S.pboard[0]);return}
 modal(`<h2>零点展開</h2><p>このターン2回攻撃できる味方UNITを1体選択。</p><div class="decklist">${S.pboard.map((u,i)=>`<div class="deckrow"><span>${u.name} / Lv${level(u)} / ATK ${atk(u)}</span><button class="btn" data-zero="${i}">選択</button></div>`).join('')}</div>`);
 document.querySelectorAll('[data-zero]').forEach(el=>el.onclick=()=>{const u=S.pboard[+el.dataset.zero];if(u)grant(u);closeModal();render()});
}
function castSpell(c){
 const id=c.baseId,b=!!c.blazing;
 if(id==='spark'){damageEnemy((b?6:4)+(hasRelic('redLens')?1:0));draw(1)}
 if(id==='flare'){if(validEnemy())damageUnit('enemy',S.selectedEnemy,b?9:6);else damageEnemy((b?6:4)+(hasRelic('redLens')?1:0))}
 if(id==='recycle'){S.free+=b?4:3;draw(1)}
 if(id==='sprout'){const h=b?5:3;S.pboard.forEach(u=>u.hp=Math.min(u.maxHp,u.hp+h));S.free+=1}
 if(id==='deepVein'){S.total++;S.free++;if(b)S.free++;draw(1);log(`深晶脈の開削：総結晶+1${b?' / 自由結晶+1':''}。`)}
 if(id==='veinRush'){S.free+=b?4:3;if(S.spellsThisTurn>=3){S.total++;S.free++;log('晶脈奔流：SPELL連鎖で総結晶+1。')}}
 if(id==='drain'){if(validEnemy())damageUnit('enemy',S.selectedEnemy,b?6:4);else damageEnemy(b?3:2);chooseReviveLowCost(2,1,'蝕み')}
 if(id==='echo')returnUnitFromDiscard(99,false,b);
 if(id==='forbiddenRevive')showReviveChoice(b);
 if(id==='thoughtSort'){draw(b?3:2);showDiscardChoice('思考整理')}
 if(id==='prism'){if(validPlayer())forceReleaseCrystal(S.selectedPlayer);draw(b?3:2)}
 if(id==='barrier')S.shield+=b?11:7;
 if(id==='forecast'){if(b){draw(2);showDiscardChoice('先読み・烈')}else draw(1);if(c.craftHeal){S.hp=Math.min(S.maxHp,S.hp+1);log('先読み・巧：HP1回復。')}S.spellDiscount++}
 if(id==='repairLight'){const h=b?8:5;S.hp=Math.min(S.maxHp,S.hp+h);log(`修復光：HPを${h}回復。`);if(S.hp>=15)draw(1)}
 if(id==='sanctuary'){S.shield+=b?10:7;const h=Math.floor(S.shield/4);if(h>0){S.hp=Math.min(S.maxHp,S.hp+h);log(`防壁展開：現在Barrier ${S.shield} を参照しHP${h}回復。`)}}
 if(id==='pursuitFlame'){const d=b?(3+(S.attacksThisTurn>=2?5:0)):(2+(S.attacksThisTurn>=2?4:0));if(validEnemy())damageUnit('enemy',S.selectedEnemy,d);else damageEnemy(d+(hasRelic('redLens')?1:0));draw(1)}
 if(id==='rekindle'){if(validPlayer())grantTwoAttacks(S.pboard[S.selectedPlayer],b?2:0,c.name);else draw(1)}
 if(id==='flowAnalysis'){draw(b?(S.spellsThisTurn>=3?4:3):(S.spellsThisTurn>=3?3:2))}
 if(id==='arcDissector'){const d=(b?8:5)+Math.min(6,S.spellsThisTurn);if(validEnemy())damageUnit('enemy',S.selectedEnemy,d);else damageEnemy(Math.ceil(d*.7))}
 if(id==='zeroPoint'){const z=(b?3:2)+(S.spellsThisTurn>=3?2:0)+(S.spellsThisTurn>=6?3:0);S.pboard.forEach(u=>u.turnAtkBonus=(u.turnAtkBonus||0)+z);log(`零点展開：味方UNIT全体のATK+${z}。`);chooseZeroPointTarget()}
 if(id==='crystalHarvest'){S.total++;S.free++;if(S.total>=7){const add=b?2:1;S.total+=add;S.free+=add;log(`晶穣：総結晶7以上で追加+${add}。`)}}
 if(id==='worldBloom'){const add=b?3:2;S.total+=add;S.free+=add;draw(1)}
 if(id==='deathChoir'){damageEnemy((b?3:2)+S.deathsThisTurn*(b?3:2));draw(1)}
 if(id==='whiteAegis'){S.shield+=b?14:9;const n=Math.min(2,Math.floor(S.hp/10));if(n>0){S.free+=n;draw(n);log(`白耀障壁：残存HPにより自由結晶+${n}・${n}枚ドロー。`)}}

function help(){modal(`<h2>COREBOUND ver1.2.2 Endless</h2><p><b>召喚コスト：</b>コストはそのターンに拘束する結晶数です。Lv用結晶はコストに含まれ、二重払いしません。例：コスト5をLv3召喚→3晶をカード上に置き、2晶を一時拘束。</p><p><b>固定：</b>召喚時にカードへ置いた結晶も、そのターンは外せません。次の自分ターン開始時に固定・一時拘束が解除されます。</p><p><b>Lv：</b>低コストカードでも自由結晶があればLv3召喚できます。Lv3召喚時能力も正常に発動します。</p><p><b>障壁：</b>プレイヤー本体がダメージを受けるとき、HPより先に障壁が同じ数値だけダメージを肩代わりします。例：障壁5で本体に8ダメージを受けると、障壁が0になりHPは3減ります。障壁はダメージを防いだ分だけ減少します。</p><p><b>緑：</b>結晶を伸ばし、コスト5〜7の大型ユニットを早期着地させて制圧する色です。巨体Xは、そのユニットが受けるダメージを常時X軽減します。</p><p><b>白：</b>本体ダメージを抑え、小回復でHP15以上を維持すると攻撃性能が上がります。回復は戦闘中の立て直し用です。</p><p><b>単色と混色：</b>初期15枚は単色に統一。報酬は開始色がやや出やすい一方、他色も提示されます。単色は安定性、混色は構築難度と引き換えに高い上限を狙います。</p><p><b>紫：</b>低コスト高スタッツの自壊ユニット、召喚時/破壊時効果、蘇生による踏み倒しを軸にします。破壊時効果はそのカードを捨て札へ置く前に解決するため、影殻が自身のドローで即座に引き直されにくくなっています。</p><p><b>青：</b>先読みは初期3枚。強力な防御スペルの反射障壁は初期デッキから外れ、第6戦以降の報酬でのみ出現します。序盤は回るが脆く、中盤以降に防御ループを完成させる成長曲線です。思考整理で手札を捨てられ、青紫では大型を捨てて蘇生する混色ルートも狙えます。</p><p><b>深度報酬：</b>深度1は基礎札中心、深度2で中核パーツ、深度3以降で勝ち筋級カードが解禁されます。深度が上がるほど高Tier率も増えます。</p><p><b>ラン構成：</b>HPが尽きるまで続くエンドレスランです。10戦を1深度とし、第3・6・9戦がエリート、第10戦がボス。ボス撃破後もHP・デッキ・遺物を引き継いで次の深度へ進みます。深度が上がるほど敵HP・攻撃力・ユニットHPが上昇します。すべての戦闘でカード報酬を得られ、エリート/ボスでは追加で遺物を獲得します。</p><p><b>分岐進化・遺物・イベント：</b>遺物はエリート・ボス報酬を中心とし、通常イベントでは大きなカード強化や高Tierカードの早期獲得を狙います。</p><p><b>敵ユニット：</b>召喚された敵ターンは攻撃せず、生存した場合は次の敵ターン以降に毎ターン攻撃します。敵ユニット上の「次:」表示が予告対象です。巨体を持つ味方は敵ユニットの優先攻撃対象になります。</p><p><b>カード用語：</b>「敵全体」は敵本体＋敵UNITすべて、「敵UNIT全体」は敵UNITのみ、「味方UNIT全体」は自分のUNITのみを指します。</p><p><b>攻撃対象：</b>敵ユニットがいても敵本体を直接攻撃できます。敵ユニットをタップするとそのユニットを攻撃対象にし、もう一度タップするか「敵本体を攻撃対象」を押すと本体狙いに戻ります。</p><p><b>赤：</b>一部ユニットは召喚したターンから攻撃でき、一部ユニットは敵UNITへの超過ダメージを敵本体へ通します。撃破から再行動や結晶回収につなげるカードも存在します。</p><button class="btn" id="close">閉じる</button>`);$('close').onclick=closeModal}
function modal(html){$('modal').innerHTML=html;$('overlay').classList.add('show')} function closeModal(){$('overlay').classList.remove('show')} let toastTimer;function toast(t){clearTimeout(toastTimer);$('toast').textContent=t;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1100)}
$('faceTarget').onclick=()=>{S.selectedEnemy=null;render()};$('endTurn').onclick=enemyTurn;$('deckBtn').onclick=showDeck;$('helpBtn').onclick=help;$('restartBtn').onclick=()=>{if(confirm('現在のランを破棄しますか？'))newRun()};newRun();
})();
</script>

<script>
(function(){
  function mobilePolish(){
    if(window.innerWidth>820) return;
    const candidates=[['戦闘ログ',['#log','.log','.battle-log']],['遺物',['#relics','.relics']],['デッキ',['#deck','.deck-list']]];
    for(const [label,sels] of candidates){
      let el=null; for(const sel of sels){ el=document.querySelector(sel); if(el) break; }
      if(el && el.parentElement && el.parentElement.tagName!=='DETAILS') {
        const d=document.createElement('details'); d.open=false;
        const sm=document.createElement('summary'); sm.textContent=label+'を表示';
        el.parentElement.insertBefore(d,el); d.appendChild(sm); d.appendChild(el);
      }
    }
    const endBtn=[...document.querySelectorAll('button')].find(b=>/ターン終了|End Turn/i.test(b.textContent));
    if(endBtn){
      endBtn.style.position='fixed'; endBtn.style.right='10px'; endBtn.style.bottom='12px'; endBtn.style.zIndex='999';
      endBtn.style.minWidth='112px'; endBtn.style.boxShadow='0 4px 18px rgba(0,0,0,.35)';
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',mobilePolish); else mobilePolish();
  window.addEventListener('resize',()=>{ if(window.innerWidth<=820) mobilePolish(); });
})();


// Mobile fallback navigation: works even when touch dragging is swallowed by the browser/webview.
document.querySelectorAll('[data-scroll-target]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const el=document.getElementById(btn.dataset.scrollTarget);
    if(!el)return;
    const dir=Number(btn.dataset.dir)||1;
    const amount=Math.max(120,Math.floor(el.clientWidth*0.78));
    if(typeof el.scrollBy==='function') el.scrollBy({left:dir*amount,behavior:'smooth'});
    else el.scrollLeft += dir*amount;
  });
});
</script>


<script id="audio-presentation">
(function(){
  const A={ctx:null, master:null, music:null, sfx:null, enabled:true, started:false, timer:null, step:0};
  const btn=()=>document.getElementById('audioToggle');
  function update(){ const b=btn(); if(!b) return; b.textContent=A.enabled?'♪ 音声ON':'♪ 音声OFF'; b.classList.toggle('danger',!A.enabled); }
  function init(){
    if(A.ctx) return;
    const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
    A.ctx=new Ctx();
    A.master=A.ctx.createGain(); A.master.gain.value=1.20; A.master.connect(A.ctx.destination);
    A.music=A.ctx.createGain(); A.music.gain.value=2.00; A.music.connect(A.master);
    A.sfx=A.ctx.createGain(); A.sfx.gain.value=.90; A.sfx.connect(A.master);
  }
  async function unlock(){
    init(); if(!A.ctx) return;
    if(A.ctx.state==='suspended') { try{ await A.ctx.resume(); }catch(e){} }
    if(!A.started){ startMusic(); A.started=true; }
    update();
  }
  function envGain(g, when, a, d){ g.setValueAtTime(0.0001, when); g.exponentialRampToValueAtTime(a, when+.01); g.exponentialRampToValueAtTime(0.0001, when+d); }
  function tone(freq, dur=.1, gain=.06, type='triangle', target='sfx'){
    if(!A.ctx || !A.enabled) return;
    const now=A.ctx.currentTime;
    const o=A.ctx.createOscillator(); const g=A.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq, now);
    if(type!=='sine') o.frequency.exponentialRampToValueAtTime(freq*0.985, now+dur);
    o.connect(g); g.connect(target==='music'?A.music:A.sfx);
    envGain(g.gain, now, gain, dur);
    o.start(now); o.stop(now+dur+.03);
  }
  function chord(freqs, dur=.55, gain=.018){ freqs.forEach((f,i)=>tone(f,dur,gain/(1+i*.35), i===0?'triangle':'sine','music')); }
  function startMusic(){
    if(A.timer || !A.ctx) return;
    const seq=[[220,277.18,329.63],[246.94,293.66,369.99],[207.65,261.63,311.13],[196,246.94,293.66]];
    const bass=[110,123.47,103.83,98];
    A.timer=setInterval(()=>{
      if(!A.enabled || !A.ctx || document.hidden) return;
      const chordNotes=seq[A.step%seq.length];
      chord(chordNotes,.68,.032);
      tone(bass[A.step%bass.length], .34, .04, 'triangle', 'music');
      if(A.step%2===0) tone(chordNotes[2]*2, .12, .018, 'sine', 'music');
      A.step++;
    }, 540);
  }
  function play(kind){
    if(!A.enabled) return;
    switch(kind){
      case 'card': tone(660,.07,.11,'triangle'); tone(990,.12,.05,'sine'); break;
      case 'select': tone(520,.06,.075,'sine'); break;
      case 'end': tone(392,.08,.09,'triangle'); tone(523.25,.14,.07,'triangle'); break;
      case 'danger': tone(180,.16,.11,'sawtooth'); break;
      case 'click': default: tone(440,.05,.065,'triangle'); break;
    }
  }
  document.addEventListener('pointerdown', unlock, {once:true});
  document.addEventListener('click', async (e)=>{
    const toggle=e.target.closest('#audioToggle');
    if(toggle){
      await unlock(); A.enabled=!A.enabled; update(); return;
    }
    const t=e.target.closest('#endTurn,.card,.mini,.choice,.unit,.btn,[data-hand],[data-player],[data-enemy]');
    if(!t) return;
    await unlock();
    if(t.matches('#endTurn')) play('end');
    else if(t.matches('.card,.choice,[data-hand]')) play('card');
    else if(t.matches('.danger')) play('danger');
    else if(t.matches('.unit,.mini,[data-player],[data-enemy]')) play('select');
    else play('click');
  }, true);
  document.addEventListener('visibilitychange',()=>{ if(A.ctx && A.ctx.state==='suspended' && !document.hidden) A.ctx.resume().catch(()=>{}); });
  update();
})();
</script>
